<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — BTS Meet & Greet</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#ffffff;--paper:#fff;--ink:#0a0a12;--muted:#6b6b7d;
    --line:#f0f0f5;--purple:#2d1b69;--gold:#c9a961;--green:#10b981;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px 20px;
    position:relative;overflow:hidden;
    letter-spacing:-0.01em;
  }
  body::before{
    content:"";position:absolute;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(45,27,105,0.07),transparent 70%);
    border-radius:50%;
  }
  body::after{
    content:"";position:absolute;bottom:-200px;left:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(201,169,97,0.07),transparent 70%);
    border-radius:50%;
  }
  .card{
    position:relative;z-index:2;
    max-width:560px;width:100%;
    background:var(--paper);border-radius:22px;
    padding:64px 52px;text-align:center;
    box-shadow:0 30px 80px rgba(10,10,18,0.08);
    border:1px solid var(--line);
  }
  .icon{
    width:108px;height:108px;margin:0 auto 30px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--green),#059669);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px rgba(16,185,129,0.35);
    animation:pop .7s cubic-bezier(0.2,0.9,0.3,1.3);
    position:relative;
  }
  .icon::after{
    content:"";position:absolute;inset:-14px;
    border-radius:50%;
    border:2px dashed rgba(16,185,129,0.28);
    animation:spin 20s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  .icon svg{width:54px;height:54px;}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 20px;
    background:#ecfdf5;color:var(--green);
    border-radius:999px;
    font-size:10.5px;font-weight:700;
    margin-bottom:24px;
    letter-spacing:0.2em;text-transform:uppercase;
  }
  .tag::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--green);
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-size:44px;font-weight:500;
    line-height:1.1;letter-spacing:-0.02em;
    margin-bottom:8px;
  }
  h1 em{font-style:italic;color:var(--purple);}
  .kr{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;color:var(--muted);
    margin-bottom:20px;
    font-weight:400;
  }
  p{
    font-size:14.5px;line-height:1.8;
    color:var(--muted);
    margin-bottom:36px;
    max-width:400px;margin-left:auto;margin-right:auto;
    font-weight:400;
  }
  .meta{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:16px;padding-top:30px;
    border-top:1px solid var(--line);
    margin-bottom:28px;
  }
  .meta-item .v{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;font-weight:700;
    color:var(--purple);margin-bottom:6px;
    font-style:italic;
  }
  .meta-item .k{
    font-size:9.5px;color:var(--muted);
    font-weight:700;
    letter-spacing:0.15em;text-transform:uppercase;
  }
  .footnote{
    font-size:10.5px;color:var(--muted);
    letter-spacing:0.15em;text-transform:uppercase;
    font-weight:700;
  }
  .footnote::after{
    content:"…";animation:dots 1.5s infinite;
  }
  @keyframes dots{0%{content:".";}33%{content:"..";}66%{content:"...";}100%{content:".";}}
  @media (max-width:520px){
    .card{padding:44px 28px;}
    h1{font-size:32px;}
    .meta{grid-template-columns:1fr;gap:16px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="tag">Application Received</div>
  <h1>Thank You, <em>ARMY</em>.</h1>
  <div class="kr">신청이 완료되었습니다</div>
  <p>
    Your application has been submitted successfully. Our team will
    personally contact you within 48 hours if you're selected.
  </p>

  <div class="meta">
    <div class="meta-item"><div class="v">48h</div><div class="k">Response</div></div>
    <div class="meta-item"><div class="v">100%</div><div class="k">Confidential</div></div>
    <div class="meta-item"><div class="v">7★</div><div class="k">Members</div></div>
  </div>

  <div class="footnote">Returning to Home</div>
</div>

<script>
  setTimeout(function(){
    window.location.href = "index.html";
  }, 5000);
</script>

</body>
</html>
