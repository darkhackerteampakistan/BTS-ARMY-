<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — BTS Meet & Greet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#ffffff;--paper:#fff;--ink:#0f0f1a;--muted:#6b6b7d;
    --line:#f0f0f5;--purple:#6b21a8;--pink:#ec4899;--green:#10b981;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px 20px;
    position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(107,33,168,0.08),transparent 70%);
    border-radius:50%;
  }
  body::after{
    content:"";position:absolute;bottom:-200px;left:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(236,72,153,0.08),transparent 70%);
    border-radius:50%;
  }
  .card{
    position:relative;z-index:2;
    max-width:540px;width:100%;
    background:var(--paper);border-radius:24px;
    padding:60px 48px;text-align:center;
    box-shadow:0 30px 80px rgba(15,15,26,0.08);
    border:1px solid var(--line);
  }
  .icon{
    width:104px;height:104px;margin:0 auto 28px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--green),#059669);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 20px 50px rgba(16,185,129,0.35);
    animation:pop .7s cubic-bezier(0.2,0.9,0.3,1.3);
    position:relative;
  }
  .icon::after{
    content:"";position:absolute;inset:-12px;
    border-radius:50%;
    border:2px dashed rgba(16,185,129,0.3);
    animation:spin 20s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
  .icon svg{width:52px;height:52px;}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 18px;
    background:#ecfdf5;color:var(--green);
    border-radius:999px;
    font-size:12px;font-weight:700;
    margin-bottom:20px;
    letter-spacing:0.06em;text-transform:uppercase;
  }
  .tag::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--green);
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:40px;font-weight:700;
    line-height:1.15;letter-spacing:-0.02em;
    margin-bottom:16px;
  }
  h1 em{font-style:italic;color:var(--purple);}
  p{
    font-size:15.5px;line-height:1.75;
    color:var(--muted);
    margin-bottom:32px;
    max-width:400px;margin-left:auto;margin-right:auto;
  }
  .meta{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:16px;padding-top:26px;
    border-top:1px solid var(--line);
    margin-bottom:26px;
  }
  .meta-item .v{
    font-family:'Playfair Display',serif;
    font-size:24px;font-weight:700;
    color:var(--purple);margin-bottom:5px;
  }
  .meta-item .k{
    font-size:11px;color:var(--muted);
    font-weight:600;
    letter-spacing:0.06em;text-transform:uppercase;
  }
  .footnote{
    font-size:11.5px;color:var(--muted);
    letter-spacing:0.1em;text-transform:uppercase;
    font-weight:600;
  }
  .footnote::after{
    content:"…";animation:dots 1.5s infinite;
  }
  @keyframes dots{0%{content:".";}33%{content:"..";}66%{content:"...";}100%{content:".";}}
  @media (max-width:520px){
    .card{padding:44px 26px;}
    h1{font-size:28px;}
    .meta{grid-template-columns:1fr;gap:14px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="tag">Application received</div>
  <h1>Thank you, <em>ARMY</em>.</h1>
  <p>
    Your application has been submitted successfully. Our team will
    personally contact you within 48 hours if you're selected.
  </p>

  <div class="meta">
    <div class="meta-item"><div class="v">48h</div><div class="k">Response</div></div>
    <div class="meta-item"><div class="v">100%</div><div class="k">Confidential</div></div>
    <div class="meta-item"><div class="v">7★</div><div class="k">Members</div></div>
  </div>

  <div class="footnote">Returning to home</div>
</div>

<script>
  setTimeout(function(){
    window.location.href = "index.html";
  }, 5000);
</script>

</body>
</html>
